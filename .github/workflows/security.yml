name: security
# OSS-only AppSec gates. No paid plugins.
#
# - bandit       : Python SAST (Apache 2.0)
# - semgrep      : multi-language SAST (LGPL 2.1)
# - gitleaks     : secret scanning (MIT)
# - pip-audit    : dependency CVE scan (Apache 2.0)
# - trivy        : container + filesystem scan (Apache 2.0)
#
# Triggered on PRs to main and pushes to main. Required on PRs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # required to upload SARIF

jobs:
  bandit:
    name: bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit==1.7.10
      - name: Run bandit
        run: |
          bandit -r app worker -ll -ii -f sarif -o bandit.sarif || true
          bandit -r app worker -ll -ii  # fail PR on high/medium
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit.sarif
          category: bandit

  semgrep:
    name: semgrep (multi-lang SAST)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:1.95.0
    steps:
      - uses: actions/checkout@v6
      - name: semgrep auto config
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/python \
            --config p/security-audit \
            --config p/secrets \
            --sarif --output semgrep.sarif \
            --error || true
          semgrep scan \
            --config p/python \
            --error \
            --severity ERROR \
            --severity WARNING
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # GITLEAKS_LICENSE not needed for public repos / OSS use

  pip-audit:
    name: pip-audit (dependency CVE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.7.3
      - name: Audit production deps
        run: pip-audit --strict --requirement <(pip install -e . --dry-run 2>&1 | grep -oP "(?<=Would install ).*" | tr ' ' '\n' | sed 's/-/=/' || true)
        continue-on-error: false
      - name: Audit project (pyproject)
        run: pip-audit --strict -r <(pip install -e . --report -)

  trivy-fs:
    name: trivy (filesystem + IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-config:
    name: trivy (Dockerfile + IaC misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
