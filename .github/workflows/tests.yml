name: tests
# Unit + lint + type check on every PR.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev]
      - name: Ruff lint
        run: ruff check app worker tests
      - name: Black format check
        run: black --check app worker tests
      - name: Mypy type check
        run: mypy app worker
        continue-on-error: true  # allow warnings until codebase fully typed
      - name: Pytest unit
        run: pytest tests/unit -v --tb=short
