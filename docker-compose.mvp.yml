# NOVA Nutrition — MVP-minimal docker-compose for Dokploy.
#
# TARGET: VPS with ~3-4 GB RAM available (other projects already deployed).
# TOTAL FOOTPRINT: ~2.1 GB steady state (db 1.2G + api 0.6G + redis 0.2G).
#
# DELIBERATE OMISSIONS at MVP launch:
#   * NO worker (Arq) container — no background jobs needed until vision /
#     coach / recalibration features have real traffic. Add later via
#     docker-compose.full.yml when scale demands it.
#   * Connection pool TIGHT — 20 max_connections vs typical 75. Sufficient
#     for <100 concurrent users.
#
# NOTE on db image:
#   Uses the SAME custom db.Dockerfile as docker-compose.yml so the 6
#   required extensions (timescaledb, vector, pgcrypto, pg_trgm, unaccent,
#   citext) are bootstrapped via /docker-entrypoint-initdb.d/init.sql.
#   shared_preload_libraries=timescaledb is enabled to keep parity with the
#   full config — Timescale costs ~50 MB RSS idle which fits in the 1.2 GB
#   container budget.
#
# UPGRADE PATH:
#   When RAM headroom appears (other projects retire or VPS upgrade), switch
#   to docker-compose.yml (full config) which adds worker container + larger
#   buffers.
#
# DEPLOY:
#   1. Dokploy: connect repo, set env vars (.env.example as template)
#   2. api container entrypoint (docker/entrypoint.sh) auto-runs
#      `alembic upgrade head` BEFORE starting uvicorn on every boot/redeploy.
#      Idempotent. Override with SKIP_MIGRATIONS=1 (NOT recommended in prod).
#   3. Owner SSH to VPS once:
#        docker exec -it $(docker ps -qf name=api) python -m scripts.seed_recipes
#        docker exec -it $(docker ps -qf name=api) python -m scripts.compute_embeddings --max-usd 1.00
#   4. Embedding backfill costs ~$0.40 and takes ~30 min (one-time).

networks:
  # External network created by Dokploy installer; Traefik also lives here.
  dokploy-network:
    external: true
  # Private backplane for db/redis. Not reachable by Traefik.
  nova-internal:
    driver: bridge

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    # Env-var pass-through policy (2026-06-04 fix):
    #   Only declare vars that are REQUIRED at runtime or that the Dokploy
    #   panel MUST be able to override. Optional knobs with safe defaults in
    #   app/core/config.py are NOT listed here — declaring `${VAR}` without a
    #   `:-fallback` injects empty strings when the panel doesn't set the var,
    #   which breaks Pydantic Settings parsing for int/float/bool/Literal
    #   fields (ValidationError: int_parsing for `""`). Letting Pydantic see
    #   "no env var present" makes it use the code default instead.
    environment:
      # REQUIRED (validators fail-loud on missing / empty in config.py)
      ENV: ${ENV}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL}
      BILLING_CANCEL_URL: ${BILLING_CANCEL_URL}
      # OPTIONAL with non-empty fallback (safe — never resolves to "")
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/secrets/jwt.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/secrets/jwt.pub}
      MVP_BLOCKED_CONDITIONS: ${MVP_BLOCKED_CONDITIONS:-diabetes_t1}
      MVP_BLOCKED_REGIONS: ${MVP_BLOCKED_REGIONS:-us}
      # Secrets / panel-managed strings (empty "" is acceptable — Pydantic
      # field type is `str` with default "").
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      APPLE_OAUTH_CLIENT_ID: ${APPLE_OAUTH_CLIENT_ID}
      APPLE_OAUTH_TEAM_ID: ${APPLE_OAUTH_TEAM_ID}
      APPLE_OAUTH_KEY_ID: ${APPLE_OAUTH_KEY_ID}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET}
      # Hardcoded uvicorn sizing for this MVP VPS profile.
      WEB_CONCURRENCY: "1"
    volumes:
      # JWT keys mounted from host (Dokploy bind mount).
      # Owner places keys on VPS at /var/dokploy/secrets/nova/jwt.{pem,pub}.
      # Container-side path matches JWT_*_KEY_PATH defaults (/secrets/jwt.*).
      - /var/dokploy/secrets/nova/jwt.pem:/secrets/jwt.pem:ro
      - /var/dokploy/secrets/nova/jwt.pub:/secrets/jwt.pub:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No host port publish: Traefik reaches api:8000 via dokploy-network.
    expose:
      - "8000"
    networks:
      - dokploy-network
      - nova-internal
    # Migrations applied automatically by docker/entrypoint.sh (ENTRYPOINT
    # in api.Dockerfile) BEFORE the uvicorn CMD runs. Idempotent.
    command:
      - "uvicorn"
      - "app.main:app"
      - "--host=0.0.0.0"
      - "--port=8000"
      - "--workers=1"
      - "--limit-concurrency=100"
      - "--timeout-keep-alive=30"
    mem_limit: 600m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 30s  # allow time for alembic upgrade on first start
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.nova-api.rule=Host(`api.ms-tech-stack.cloud`)
      - traefik.http.routers.nova-api.entrypoints=websecure
      - traefik.http.routers.nova-api.tls=true
      - traefik.http.routers.nova-api.tls.certresolver=letsencrypt
      - traefik.http.services.nova-api.loadbalancer.server.port=8000

  db:
    # Custom image bootstraps the 6 required extensions via init.sql.
    # MUST NOT be replaced by vanilla pgvector — Alembic assumes timescaledb,
    # pgcrypto, pg_trgm, unaccent, citext all exist.
    build:
      context: ./docker
      dockerfile: db.Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nova}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-novapass}
      POSTGRES_DB: ${POSTGRES_DB:-nova}
    # Tuned for ~1.2 GB container limit.
    # shared_buffers 25% of container limit.
    # effective_cache_size assumes some host OS cache help.
    command: >
      postgres
      -c shared_buffers=300MB
      -c max_connections=20
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=800MB
      -c random_page_cost=1.1
      -c wal_buffers=4MB
      -c log_min_duration_statement=1000
      -c shared_preload_libraries=timescaledb
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256m
    networks:
      - nova-internal
    mem_limit: 1200m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nova} -d ${POSTGRES_DB:-nova}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 150mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    volumes:
      - redisdata:/data
    networks:
      - nova-internal
    mem_limit: 200m
    cpus: 0.3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: {}
  redisdata: {}
