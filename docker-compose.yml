# Hostinger KVM 2 tuned (8 GB RAM / 2 vCPU / 100 GB NVMe).
# Container budget: db 3G + api 0.6G + worker 1.5G + redis 0.4G = 5.5G
# OS + Dokploy + Traefik ≈ 0.7G → ≈ 1.8G headroom for spikes.
# See spec §23 for the tuning matrix and upgrade signals.
#
# Dokploy integration:
#   - api joins `dokploy-network` (external, created by Dokploy) so Traefik
#     can route by Host() rule. db/redis/worker stay on private `nova-internal`.
#   - api exposes 8000 internally only (no host port publish); Traefik
#     terminates TLS at api.ms-tech-stack.cloud and proxies to api:8000.
#   - Environment variables are declared per-service via ${VAR} substitution
#     so Dokploy panel secrets flow in explicitly (NOT via implicit env_file).
#   - Resource limits use top-level `mem_limit`/`cpus` (compose v2 honours these
#     under `docker compose up`, unlike `deploy.resources` which only applies
#     under Swarm).

networks:
  # External network created by Dokploy installer; Traefik also lives here.
  dokploy-network:
    external: true
  # Private backplane for db/redis/worker. Not reachable by Traefik.
  nova-internal:
    driver: bridge

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    # Env-var pass-through policy (2026-06-04 fix):
    #   Only declare vars that are REQUIRED at runtime or that the Dokploy
    #   panel MUST be able to override. Optional knobs with safe defaults in
    #   app/core/config.py are NOT listed here — declaring `${VAR}` without a
    #   `:-fallback` injects empty strings when the panel doesn't set the var,
    #   which breaks Pydantic Settings parsing for int/float/bool/Literal
    #   fields (ValidationError: int_parsing for `""`). Letting Pydantic see
    #   "no env var present" makes it use the code default instead.
    environment:
      # REQUIRED (validators fail-loud on missing / empty in config.py)
      ENV: ${ENV}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL}
      BILLING_CANCEL_URL: ${BILLING_CANCEL_URL}
      # OPTIONAL with non-empty fallback (safe — never resolves to "")
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/secrets/jwt.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/secrets/jwt.pub}
      MVP_BLOCKED_CONDITIONS: ${MVP_BLOCKED_CONDITIONS:-diabetes_t1}
      MVP_BLOCKED_REGIONS: ${MVP_BLOCKED_REGIONS:-us}
      EMAIL_ENABLED: ${EMAIL_ENABLED}
      # Secrets / panel-managed strings (empty "" is an acceptable Pydantic
      # value here — field type is `str` with default "").
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      APPLE_OAUTH_CLIENT_ID: ${APPLE_OAUTH_CLIENT_ID}
      APPLE_OAUTH_TEAM_ID: ${APPLE_OAUTH_TEAM_ID}
      APPLE_OAUTH_KEY_ID: ${APPLE_OAUTH_KEY_ID}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET}
      # Hardcoded uvicorn sizing for this VPS profile (overrides code default).
      WEB_CONCURRENCY: "2"
    volumes:
      # JWT key files mounted from host (Dokploy bind mount).
      # Owner places keys at /var/dokploy/secrets/nova/jwt.{pem,pub} on VPS.
      # Permissions: jwt.pem=400 (owner read), jwt.pub=444 (all read).
      # Container-side path matches JWT_*_KEY_PATH defaults (/secrets/jwt.*).
      - /var/dokploy/secrets/nova/jwt.pem:/secrets/jwt.pem:ro
      - /var/dokploy/secrets/nova/jwt.pub:/secrets/jwt.pub:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No host port publish: Traefik reaches api:8000 via dokploy-network.
    expose:
      - "8000"
    networks:
      - dokploy-network
      - nova-internal
    # Migrations applied automatically by docker/entrypoint.sh (ENTRYPOINT
    # in api.Dockerfile) BEFORE the uvicorn CMD runs. Idempotent.
    command:
      - "uvicorn"
      - "app.main:app"
      - "--host=0.0.0.0"
      - "--port=8000"
      - "--workers=2"
      - "--limit-concurrency=200"
      - "--timeout-keep-alive=30"
    mem_limit: 600m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 30s  # allow alembic upgrade on first boot
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.nova-api.rule=Host(`api.ms-tech-stack.cloud`)
      - traefik.http.routers.nova-api.entrypoints=websecure
      - traefik.http.routers.nova-api.tls=true
      - traefik.http.routers.nova-api.tls.certresolver=letsencrypt
      - traefik.http.services.nova-api.loadbalancer.server.port=8000

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    # See env-var pass-through policy comment on `api.environment` above.
    environment:
      # REQUIRED
      ENV: ${ENV}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL}
      BILLING_CANCEL_URL: ${BILLING_CANCEL_URL}
      # Secrets / panel-managed strings
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMAIL_ENABLED: ${EMAIL_ENABLED}
      RESEND_API_KEY: ${RESEND_API_KEY}
      # Hardcoded worker sizing for this VPS profile.
      ARQ_MAX_JOBS: "2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      # dokploy-network required to reach the Dokploy-managed Postgres
      # (mstechllc-novaappdb-fh5s05) which is the DATABASE_URL target in prod.
      # Without it the worker resolves to the local compose-managed db, which
      # is NOT the database the api writes to → all arq jobs fail with
      # `socket.gaierror: Temporary failure in name resolution`.
      - dokploy-network
      - nova-internal
    command: ["arq", "worker.main.WorkerSettings"]
    mem_limit: 1500m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      # Arq has no built-in health endpoint; ensure process can import settings.
      test: ["CMD", "python", "-c", "import worker.main"]
      interval: 60s
      timeout: 15s
      start_period: 20s
      retries: 3

  db:
    # Custom image bootstraps timescaledb + vector + pgcrypto + pg_trgm +
    # unaccent + citext via docker/init.sql on first init. Must NOT be
    # swapped for vanilla pgvector — Alembic migrations assume all 6
    # extensions exist.
    build:
      context: ./docker
      dockerfile: db.Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nova}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-novapass}
      POSTGRES_DB: ${POSTGRES_DB:-nova}
      # Tuning for 8GB host (spec §23.2).
      POSTGRES_SHARED_BUFFERS: 2GB
      POSTGRES_MAX_CONNECTIONS: "75"
      POSTGRES_WORK_MEM: 16MB
      POSTGRES_MAINTENANCE_WORK_MEM: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 4GB
      POSTGRES_RANDOM_PAGE_COST: "1.1"
      POSTGRES_WAL_BUFFERS: 16MB
    command: >
      postgres
      -c shared_buffers=2GB
      -c max_connections=75
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c effective_cache_size=4GB
      -c random_page_cost=1.1
      -c wal_buffers=16MB
      -c shared_preload_libraries=timescaledb
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 1g
    networks:
      - nova-internal
    mem_limit: 3000m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nova} -d ${POSTGRES_DB:-nova}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 300mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    volumes:
      - redisdata:/data
    networks:
      - nova-internal
    mem_limit: 400m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: {}
  redisdata: {}
