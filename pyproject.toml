[project]
name = "nova-nutrition-backend"
version = "0.1.0"
description = "NOVA Nutrition backend — FastAPI + Postgres/Timescale + pgvector + Redis + Arq"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "NOVA Nutrition" }]

dependencies = [
    # web
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    # Required by FastAPI for any endpoint using Form() / File() / UploadFile.
    # Used by app/tracking/presentation/progress_router.py (progress photo
    # upload). Without it the app crashes at import time:
    # RuntimeError: Form data requires "python-multipart" to be installed.
    "python-multipart>=0.0.12,<0.1",
    # data
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.15",
    "pgvector>=0.3.6,<0.4",
    # schemas / config
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "email-validator>=2.2,<3",  # explicit + transitive via pydantic[email]
    # workers + cache
    "arq>=0.26,<0.27",
    "redis>=5.2,<6",
    # logging
    "structlog>=24.4,<25",
    # security
    "pyjwt[crypto]>=2.10,<3",
    "argon2-cffi>=23.1,<24",
    # imaging
    # pyvips (libvips bindings) covers all NOVA cases as a single tool:
    # HEIC iOS + JPG/PNG/WEBP/AVIF Android, EXIF-aware autorotate, resize,
    # encode with metadata stripped, post-strip EXIF verification. libvips
    # is the same backend used by Sharp (Node.js) — industry standard for
    # image pipelines: faster, lower-memory than Pillow, and HEIC support
    # is built in when libvips is compiled with libheif (default on
    # Debian-slim + brew). Trade-off: one system dep (libvips42 + libheif1)
    # vs two Python deps (Pillow + pillow-heif). See vips_compressor.py.
    "pyvips>=2.2,<3",
    # Pillow is runtime-required: vision `_detect_detail_level` uses PIL as
    # a fallback decoder to read image dimensions when pyvips cannot (e.g.
    # in-process test envs, or when libvips lacks a format plugin). Without
    # Pillow in prod, the fallback raises and detail_level defaults to
    # "high" → ~9x OpenAI Vision token cost. Also used by dev test fixtures
    # to synthesise PNG/JPEG. See app/vision/infrastructure/openai_vision.py.
    "pillow>=12,<13",
    # ai
    "openai>=1.50,<2",
    "tiktoken>=0.8,<0.9",
    # http
    "httpx>=0.27,<0.28",
    # observability
    "prometheus-client>=0.21,<0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6",
    "hypothesis>=6.118,<7",
    "testcontainers[postgres]>=4.8,<5",
    "fakeredis>=2.26,<3",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# `S` enables the full flake8-bandit ruleset (S101..S701), which covers:
#   S608  hardcoded-sql-expression  — flags `text(f"...")` and string-built SQL
#   S602..S607  shell injection family
#   S301..S324  pickle / hashlib weak crypto
# Any acceptable use of f-string SQL (pgvector vector literals, statically
# authored WHERE-clause builders) MUST carry an inline `# noqa: S608` with a
# justification comment explaining why the f-string substitution is not a
# vector. The audit log lives in docs/security/PLAN.md.
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "PL"]
ignore = [
    "S101",     # assert in tests OK
    "PLR2004",  # magic numbers OK
    "PLR0913",  # too many args (>5) — pre-existing baseline, defer
    "PLR0915",  # too many statements (>50) — pre-existing baseline, defer
    "PLR0912",  # too many branches — pre-existing baseline, defer
    "PLR0911",  # too many returns — dispatch/reconstruct fns, intentional
    "E501",     # line too long (>100) — formatter handles, defer manual fix
    # S110 (try-except-pass): the codebase deliberately uses best-effort
    # defensive reads (getattr on request.state, optional telemetry) that MUST
    # NOT fail the request. Consistent with the BLE001-everywhere convention.
    "S110",
    # PLW2901 (loop var overwrite): used to normalise gather() Exception
    # results to None in-loop (vision macro grounder). Intentional.
    "PLW2901",
]

# FastAPI dependency-injection markers MUST appear in argument defaults — that
# is the framework idiom (Query/Body/File/Header/Depends/etc. are how FastAPI
# binds inputs to routes). Excluding them from B008 is the canonical fix
# recommended by both ruff and FastAPI docs.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.format]
# ruff format is a drop-in replacement for black; same output, 30x faster.
# Line length inherited from [tool.ruff].

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# pyvips ships no PEP 561 marker / stubs. The C-bindings surface we use
# (Image.new_from_buffer, autorot, resize, write_to_buffer, get_fields,
# remove, .width, .height) is stable since 2.0 and documented; the
# alternative is hand-rolled stubs that drift. Allow untyped at the
# import boundary; call sites are still strictly typed via local
# annotations.
[[tool.mypy.overrides]]
module = "pyvips"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: tests slower than 1s",
    "integration: requires testcontainers",
    "property: hypothesis property-based tests",
    "eval: AI golden-set evaluation (skipped unless RUN_GOLDEN_SET=true)",
]

[tool.coverage.run]
branch = true
source = ["app", "worker"]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]

