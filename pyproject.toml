[project]
name = "nova-nutrition-backend"
version = "0.1.0"
description = "NOVA Nutrition backend — FastAPI + Postgres/Timescale + pgvector + Redis + Arq"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "NOVA Nutrition" }]

dependencies = [
    # web
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    # data
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.15",
    "pgvector>=0.3.6,<0.4",
    # schemas / config
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    # workers + cache
    "arq>=0.26,<0.27",
    "redis>=5.2,<6",
    # logging
    "structlog>=24.4,<25",
    # security
    "pyjwt[crypto]>=2.10,<3",
    "argon2-cffi>=23.1,<24",
    # imaging
    "pyvips>=2.2,<3",
    "pillow-heif>=0.21,<0.22",
    "exifread>=3.0,<4",
    # ai
    "openai>=1.50,<2",
    "tiktoken>=0.8,<0.9",
    # http
    "httpx>=0.27,<0.28",
    # observability
    "prometheus-client>=0.21,<0.26",
    # i18n / formatting
    "babel>=2.16,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6",
    "pytest-benchmark>=5.0,<6",
    "hypothesis>=6.118,<7",
    "factory-boy>=3.3,<4",
    "testcontainers[postgres,redis]>=4.8,<5",
    "fakeredis>=2.26,<3",
    "mutmut>=2.5,<3",
    "schemathesis>=3.39,<4",
    "ruff>=0.7,<0.8",
    "black>=24.10,<25",
    "mypy>=1.13,<2",
    "types-jwt>=0.1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "PL"]
ignore = ["S101", "PLR2004"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: tests slower than 1s",
    "integration: requires testcontainers",
    "clinical: ADR-gated clinical safety tests",
    "property: hypothesis property-based tests",
]

[tool.coverage.run]
branch = true
source = ["app", "worker"]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "plan domain may not import tracking domain"
type = "forbidden"
source_modules = ["app.plan.domain", "app.plan.application"]
forbidden_modules = ["app.tracking.domain", "app.tracking.application"]

[[tool.importlinter.contracts]]
name = "new plan algorithm modules framework-agnostic"
type = "forbidden"
source_modules = [
    "app.plan.domain.macro_calculator",
    "app.plan.domain.bmr_safety",
    "app.plan.domain.context",
    "app.plan.domain.ports",
    "app.shared.domain",
]
forbidden_modules = ["fastapi", "sqlalchemy", "pydantic", "starlette", "app.core.errors"]

[[tool.importlinter.contracts]]
name = "plan.domain must not import infrastructure or presentation"
type = "forbidden"
source_modules = ["app.plan.domain"]
forbidden_modules = ["app.plan.infrastructure", "app.plan.presentation"]

[dependency-groups]
dev = [
    "import-linter>=2.11",
]
